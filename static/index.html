<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Form Self-Healing & Support Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 40px; color: #1e293b; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-top: 0; color: #0f172a; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .assistant-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 16px; margin-top: 24px; }
        .assistant-title { font-weight: 700; color: #166534; margin-bottom: 8px; font-size: 15px; }
        textarea { width: 100%; height: 70px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        button { background: #2563eb; color: #fff; padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Onboarding Request Form with Real-Time Support</h1>
        <form id="claimForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="full_name" placeholder="Varunteja Chirukuri">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="555-0199">
            </div>
            <div class="form-group">
                <label>ZIP Code</label>
                <input type="text" id="zip_code" placeholder="94043">
            </div>
            <div class="form-group">
                <label>Estimated Monthly Budget ($)</label>
                <input type="number" id="monthly_budget" placeholder="3000">
            </div>
        </form>

        <div class="assistant-box">
            <div class="assistant-title">AI Support Assistant: Quick Auto-Fill</div>
            <p style="margin: 0 0 8px 0; font-size: 13px; color: #15803d;">Stuck or have messy notes? Describe your details below, and the assistant will format and populate the form.</p>
            <textarea id="nlInput" placeholder="e.g. My email is alex@startup.io, reached at 415-555-0123 in zip 94107 with a budget of 4.5k"></textarea>
            <button type="button" onclick="autoFill()">Auto-Extract & Fill Form</button>
        </div>
    </div>
    <script>
        function autoFill() {
            const text = document.getElementById('nlInput').value;
            const email = text.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
            const phone = text.match(/\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);
            const zip = text.match(/\b\d{5}\b/);
            const budget = text.match(/\$?(\d+(?:\.\d+)?)\s*(k|thousand)/i);

            if (email) document.getElementById('email').value = email[0];
            if (phone) document.getElementById('phone').value = phone[0];
            if (zip) document.getElementById('zip_code').value = zip[0];
            if (budget) document.getElementById('monthly_budget').value = parseFloat(budget[1]) * 1000;
        }
    </script>
</body>
</html>
